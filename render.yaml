# ============================================================
# RENDER.COM DEPLOYMENT CONFIGURATION
# ============================================================

services:
  - type: web
    name: flynn-portfolio
    runtime: static
    repo: https://github.com/flynnj30/flynn-portfolio.git
    branch: main
    buildCommand: echo "No build step required"
    staticPublishPath: .
    
    # Environment Variables
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: EMAILJS_PUBLIC_KEY
        value: crekfvN6H352DXAfx
      - key: EMAILJS_SERVICE_ID
        value: service_av4pfmh
      - key: EMAILJS_TEMPLATE_ID
        value: template_vcqi0qv

    # Route Configuration
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Security Headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    # Health Check
    healthCheckPath: /

    # Auto-Deploy on Push
    autoDeploy: true