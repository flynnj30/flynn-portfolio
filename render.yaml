services:
  - type: web
    name: flynn-portfolio
    runtime: static
    repo: https://github.com/flynnj30/flynn-portfolio.git
    branch: main
    buildCommand: echo "No build step required"
    staticPublishPath: .
    
    envVars:
      - key: NODE_VERSION
        value: 18.17.0

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    healthCheckPath: /
    autoDeploy: true