# ============================================================
# RENDER.COM DEPLOYMENT CONFIGURATION
# ============================================================

services:
  # ===== Backend API Server =====
  - type: web
    name: flynn-portfolio-api
    runtime: node
    repo: https://github.com/flynnj30/flynn-portfolio.git
    branch: main
    buildCommand: npm install
    startCommand: node server/verify-recaptcha.js
    
    envVars:
      - key: RECAPTCHA_SECRET_KEY
        value: your_actual_secret_key_here  # ⚠️ REPLACE WITH ACTUAL KEY
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

    healthCheckPath: /api/health

  # ===== Static Frontend =====
  - type: web
    name: flynn-portfolio
    runtime: static
    repo: https://github.com/flynnj30/flynn-portfolio.git
    branch: main
    buildCommand: echo "No build step required"
    staticPublishPath: .
    
    envVars:
      - key: NODE_VERSION
        value: 18.17.0

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()

    healthCheckPath: /
    autoDeploy: true